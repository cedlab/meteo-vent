<style>

    --accent:#3987e5;

*{box-sizing:border-box}
body{margin:0;font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
header{padding:10px 12px 0;max-width:1500px;margin:0 auto}
.titlebar{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:11.5px}
.spotsbar{display:flex;gap:6px;align-items:center;margin-top:8px}
main{padding:0 12px 30px;max-width:1500px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;gap:5px;overflow-x:auto;flex:1;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12.5px;white-space:nowrap}
.chip:hover{border-color:var(--text-2)}
.chip.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.chip .x{opacity:.55;font-size:11px;padding-left:2px}
.chip .x:hover{opacity:1}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.controls .nav{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--text-2);padding:4px 8px;font:inherit;font-size:12px;cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--surface-2);color:var(--text);font-weight:600}
.search{position:relative;flex:none}
.search input{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);width:90px;transition:width .2s}
.search input:focus{width:200px;outline:none;border-color:var(--text-2)}
.results{position:absolute;top:110%;right:0;z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}
.results div{padding:8px 12px;cursor:pointer}
.results div:hover{background:var(--surface-2)}
.results small{color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px;cursor:pointer}
.day:hover{border-color:var(--text-2)}
.day .d{font-weight:600;text-transform:capitalize}
.day .big{font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.day .big small{font-size:13px;font-weight:500;color:var(--text-2)}
.day .meta{color:var(--text-2);font-size:11.5px;margin-top:4px;display:flex;flex-direction:column;gap:2px}
.bar{height:6px;border-radius:3px;margin-top:8px;box-shadow:inset 0 0 0 1px var(--border)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--text-2);margin-top:6px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.fc{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:12px}
table.fc th,table.fc td{padding:0;text-align:center;min-width:27px;height:23px}
table.fc th.lab{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:0 4px 0 0;color:var(--text-2);font-weight:500;min-width:38px;font-size:11px;line-height:1.05;white-space:nowrap}
table.fc th.lab small{display:block;color:var(--muted);font-size:9.5px;font-weight:400}
table.fc td.dsep, table.fc th.dsep{border-left:2px solid var(--border)}
table.fc tr.dayrow th{font-weight:600;text-align:left;padding-left:4px;text-transform:capitalize;height:20px;color:var(--text);font-size:11.5px;white-space:nowrap;overflow:hidden;max-width:0}
table.fc tr.hr td{color:var(--muted);font-size:10.5px;height:17px}
table.fc td.w{font-weight:600;border-radius:3px;border:1px solid var(--surface)}
table.fc td.night{opacity:.78}
.arrow{display:inline-block;width:15px;height:15px;vertical-align:middle}
.dirtxt{display:block;font-size:8.5px;color:var(--muted);line-height:1}
.nowcast{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.nowcast b{color:var(--text)}
.nowcast .q{display:inline-flex;gap:2px}
.nowcast .q span{display:inline-block;width:14px;height:14px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--border)}
.nowcast .q span.h{margin-left:4px}
table.fc tr.grp th{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;height:18px;padding-top:6px;text-align:left}
table.fc tr.rm th.lab{font-size:9.5px}
table.fc td.na{background:repeating-linear-gradient(135deg,transparent 0 3px,var(--grid) 3px 4px)}
table.fc tr.rm td{font-size:11px}
.relay{color:var(--muted);font-size:11px;margin-top:6px}
.rain{color:var(--accent);font-weight:600}
.legend-scale{display:flex;gap:2px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:10.5px;color:var(--text-2)}
.legend-scale span.sw{display:inline-block;width:24px;height:14px;border-radius:3px;text-align:center;line-height:13px;font-size:9.5px}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text-2);margin-bottom:6px}
.chart-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.chart-legend label{cursor:pointer;display:inline-flex;align-items:center;gap:4px}
#chartbox{position:relative}
#tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.14);display:none;z-index:5;min-width:170px}
#tip .t{font-weight:600;margin-bottom:4px;text-transform:capitalize}
#tip .r{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
#tip i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
h2{font-size:14px;margin:0 0 8px;font-weight:620}
h2 small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
.status{color:var(--text-2);padding:24px 0;text-align:center}
.err{color:#d03b3b}
footer{color:var(--muted);font-size:11px;text-align:center;padding:10px}
footer a{color:inherit}
@media (max-width:600px){
  header{padding:8px 8px 0} main{padding:0 6px 24px}
  .card{padding:8px 6px;border-radius:8px;margin-top:8px}
  .tcard{padding:6px 4px}
  .controls{gap:4px;margin-bottom:6px}
  .seg button{padding:4px 6px;font-size:11.5px}
  table.fc{font-size:11px}
  table.fc th,table.fc td{min-width:23px;height:21px}
  table.fc th.lab{min-width:33px;font-size:10px}
  table.fc th.lab small{font-size:8.5px}
  table.fc tr.hr td{font-size:9.5px;height:15px}
  .arrow{width:13px;height:13px}
  .days{grid-template-columns:repeat(2,1fr);gap:6px}
  .day .big{font-size:20px}
}
.viewseg{margin-left:auto}
#simple{display:none}
body.simple #simple{display:block}
body.simple .tcard, body.simple #content{display:none}
.hero{display:flex;gap:14px;align-items:center}
.hero .ico{width:84px;height:84px;flex:none}
.hero .temp{font-size:46px;font-weight:650;letter-spacing:-.03em;line-height:1}
.hero .what{font-size:15px;font-weight:600;margin-top:2px}
.hero .wind{font-size:12.5px;color:var(--text-2);margin-top:3px}
.summary{margin-top:10px;font-size:13.5px;line-height:1.45;color:var(--text)}
.summary b{font-weight:600}
.ribbon{margin-top:4px}
.ribbon .labels,.ribbon .temps{display:flex}
.ribbon .labels span,.ribbon .temps span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ribbon .temps span{font-size:12.5px;color:var(--text);font-weight:600}
.ribbon .icons{display:flex}
.ribbon .icons span{flex:1;display:flex;justify-content:center}
.ribbon .icons svg{width:26px;height:26px}
.ribbon .band{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:4px 0;position:relative}
.ribbon .band i{flex:1}
.ribbon .band .rain{position:absolute;bottom:0;height:5px;background:#3d5bd9;border-radius:2px}
.ribbon .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px}
.tips{display:flex;flex-wrap:wrap;gap:6px}
.tip{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px}
.tip.ok{opacity:.7}
.week .d{display:grid;grid-template-columns:62px 30px 1fr 64px 62px;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--border)}
.week .d:first-child{border-top:0}
.week .dn{font-weight:600;text-transform:capitalize;font-size:13px}
.week svg{width:28px;height:28px}
.trange{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:12.5px}
.trange .lo{color:var(--text-2);width:22px;text-align:right}
.trange .hi{font-weight:600;width:22px}
.trange .track{flex:1;height:6px;border-radius:3px;background:var(--surface-2);position:relative}
.trange .track i{position:absolute;top:0;bottom:0;border-radius:3px}
.week .rn{font-size:12px;color:#3d5bd9;text-align:right;white-space:nowrap}
.week .rn small{display:block;color:var(--muted);font-size:10px}
.week .wd{font-size:12px;text-align:right;white-space:nowrap}
.week .wd span{display:inline-block;padding:1px 6px;border-radius:6px;font-weight:600;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme: dark){ .week .rn{color:#8fa4ff} }
.scard{padding-bottom:6px}
#sHead .sw{font-size:13px;color:var(--text-2)}
#sHead .sw::first-letter{text-transform:uppercase}
#sHead .sbig{display:flex;align-items:center;gap:8px;margin-top:2px}
#sHead .ico{width:58px;height:58px}
#sHead .stemp{font-size:46px;font-weight:650;letter-spacing:-.03em;line-height:1}
#sHead .sright{margin-left:auto;text-align:right}
#sHead .sdesc{font-size:15px;font-weight:600}
#sHead .sminmax{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
#sHead .sline{font-size:12.5px;color:var(--text-2);margin-top:4px;min-height:34px}
.scrub{position:relative;margin:8px -12px 0}
.scroller{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.scroller::-webkit-scrollbar{display:none}
.scroller .pad{flex:none}
.hc{flex:none;width:52px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0 6px;cursor:pointer;border-radius:10px;transition:background .15s}
.hc.midnight{border-left:1px dashed var(--border)}
.hc.sel{background:var(--surface-2)}
.hc .hdl{font-size:10px;font-weight:600;color:var(--text);height:13px;white-space:nowrap;text-transform:capitalize}
.hc .hh{font-size:11px;color:var(--muted)}
.hc svg{width:30px;height:30px}
.hc .ht{font-size:14px;font-weight:600}
.hc .hb{align-self:stretch;height:6px}
.hc .hr{font-size:10.5px;color:#3d5bd9;height:13px;font-variant-numeric:tabular-nums}
.hc .hw{display:flex;align-items:center;gap:1px;font-size:10.5px}
.hc .hw .arrow{width:12px;height:12px}
.hc .hw span{padding:0 4px;border-radius:5px;font-weight:600;font-variant-numeric:tabular-nums}
.scrub .marker{position:absolute;left:50%;top:0;width:0;height:0;margin-left:-6px;border:6px solid transparent;border-top-color:var(--text);opacity:.5;pointer-events:none}
.hc .hdl .sun.night{color:#5b6fb5}
.hc .hdl .sun{color:#d98a00;font-weight:600;font-size:9.5px}
.sunline{font-size:12.5px;color:var(--text-2);margin:-2px 0 6px}
.legendline{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px}
.dchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:4px}
.dchips::-webkit-scrollbar{display:none}
.dchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;width:62px;padding:6px 2px;border-radius:12px;border:1.5px solid transparent;background:var(--surface-2);color:var(--text);font:inherit;cursor:pointer}
.dchip.on{border-color:var(--text);background:var(--surface)}
.dchip .dn{font-size:12px;text-transform:capitalize;color:var(--text-2)}
.dchip .dd{font-size:10px;color:var(--muted);margin-top:-2px}
.dchip svg{width:30px;height:30px}
.dchip .dt{font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-2)}
.dchip .dt b{color:var(--text)}
.dchip .dr{font-size:10px;color:#3d5bd9}
@media (prefers-color-scheme: dark){ .hc .hr,.dchip .dr{color:#8fa4ff} }
@media (max-width:600px){ .scrub{margin:8px -6px 0} }
html{-webkit-tap-highlight-color:transparent}
button,input{touch-action:manipulation}
.spotbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--text);padding:4px 0;font:inherit;cursor:pointer;min-width:0;max-width:65%}
.spotbtn h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spotbtn .caret{width:12px;height:8px;flex:none;color:var(--text-2)}
.titlebar{align-items:center;flex-wrap:nowrap}
header .sub{margin-top:0}
.viewseg button{padding:6px 10px}
.sheet{position:fixed;inset:0;z-index:50}
.sheet[hidden]{display:none}
.sheet .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.35);animation:fade .2s}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:85vh;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:6px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .22s ease-out;max-width:560px;margin:0 auto}

.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheethead b{font-size:17px}
.sheethead button{border:0;background:none;color:var(--accent);font:inherit;font-size:15px;padding:6px 0;cursor:pointer}
#q{width:100%;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);outline:none;-webkit-appearance:none}

.srow .stext{flex:1;min-width:0;display:flex;flex-direction:column}
.srow .sname{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.srow .sdel.confirm{background:#d64545;color:#fff}
.slabel{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 4px 2px}
#results .srow{border-bottom-style:dashed}
#results .none{padding:12px 4px;color:var(--muted)}
body.noscroll{overflow:hidden}
.gkey{display:flex;gap:8px;margin-top:6px}

.gkey button{border:0;border-radius:12px;padding:0 16px;background:var(--text);color:var(--surface);font:inherit;font-size:15px;cursor:pointer}

</style>

<body>
<header>
  <div class="titlebar">
    <button class="spotbtn" id="spotBtn" aria-label="Changer de spot"><h1 id="title">Vent & météo</h1><svg class="caret" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="seg viewseg" id="viewSeg"></div>
  </div>
  <div class="sub" id="subtitle"></div>
</header>
<div class="sheet" id="sheet" hidden>
  <div class="backdrop" id="sheetBg"></div>
  <div class="panel" role="dialog" aria-label="Spots">
    <div class="grip"></div>
    <div class="sheethead"><b>Spots</b><button id="sheetClose">Fermer</button></div>
    <input id="q" type="search" placeholder="Ajouter : ville, plage, port…" autocomplete="off" autocorrect="off" enterkeyhint="search">
    <div id="results"></div>
    <button class="srow geo" id="geoBtn"><span class="sname">📍 Ma position</span><small id="geoMsg">utiliser la localisation du téléphone</small></button>
    <div class="slabel">Mes spots</div>
    <div id="spotList"></div>
    <div class="slabel">Prévision officielle Google (facultatif)</div>
    <div class="gkey">
      <input id="gkey" type="text" placeholder="Clé API Google Weather" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="gkeySave">OK</button>
    </div>
    <div class="gkeymsg" id="gkeyMsg"></div>
  </div>
</div>
<main>
  <section id="simple"></section>
  <section class="card tcard">
    <div class="controls">
      <div class="seg" id="modelSeg"></div>
      <div class="seg" id="unitSeg"></div>
      <div class="seg" id="stepSeg" title="Pas horaire"></div>
      <div class="seg" id="daysSeg" title="Nombre de jours"></div>
      <div class="seg nav"><button id="scrL" title="Jour précédent">◀</button><button id="scrR" title="Jour suivant">▶</button></div>
    </div>
    <div id="tableArea"><div class="status">Chargement…</div></div>
  </section>
  <div id="content"></div>
</main>
<footer>Données <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (Météo-France AROME/ARPEGE, DWD ICON, NOAA GFS, ECMWF IFS) · houle : Open-Meteo Marine · version du 17/11 19h30</footer>

const DEFAULT_SPOTS = [

// Échelles de couleurs Windguru : [valeur, r, g, b, alpha], interpolation linéaire
const WG = {
  wind:  [[0,255,255,255,1],[5,255,255,255,1],[8.9,103,247,241,1],[13.5,0,255,0,1],[18.8,255,240,0,1],[24.7,255,50,44,1],[31.7,255,10,200,1],[38,255,0,255,1],[45,150,50,255,1],[60,60,60,255,1],[70,0,0,255,1]],

  cloud: [[0,255,255,255,1],[100,120,120,120,1]],
  rain:  [[0,110,110,250,0],[3,110,110,250,1],[10,115,115,255,1]],   // mm/h
  waves: [[0,255,255,255,1],[0.3,255,255,255,1],[3,122,131,255,1],[5,173,90,201,1],[8,255,80,100,1],[15,255,200,100,1]],
  period:[[0,255,255,255,1],[10,255,255,255,1],[20,252,81,81,1]],
};
const isDark = () => matchMedia("(prefers-color-scheme: dark)").matches;
function wgColor(scale, v){
  if(v==null) return ["transparent","var(--muted)"];
  const s = WG[scale]; let c;
  if(v<=s[0][0]) c=s[0].slice(1); else if(v>=s[s.length-1][0]) c=s[s.length-1].slice(1);
  else { for(let i=1;i<s.length;i++){ if(v<=s[i][0]){ const a=s[i-1], b=s[i], t=(v-a[0])/(b[0]-a[0]); c=[1,2,3,4].map(k=>a[k]+(b[k]-a[k])*t); break; } } }
  const [r,g,b,al] = c;
  // en mode sombre, les cases blanches (vent faible, mer plate…) se fondent dans le fond
  if(isDark() && r>248 && g>248 && b>248) return ["transparent","var(--text)"];
  const bright = Math.sqrt(r*r*.241+g*g*.691+b*b*.068);
  const fg = al<0.5 ? "var(--text)" : (bright<140 ? "#fff" : "#202020");
  return [`rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${al.toFixed(3)})`, fg];
}
const windColor = kn => wgColor("wind", kn);

function localWind(dir, kn){
  if(dir==null||kn==null||kn<12) return null;
  if(dir>=280&&dir<=345) return "Mistral";
  if(dir>=60&&dir<=120) return "Vent d'est";
  if(dir>=200&&dir<280) return "Ouest / Labé";
  if(dir>=120&&dir<200) return "Sirocco / Marin";
  return null;
}

function arrowSVG(dir, color){
  if(dir==null) return "";
  // dir = provenance ; la flèche montre où va le vent
  return `<svg class="arrow" viewBox="0 0 20 20" style="transform:rotate(${dir+180}deg)"><path d="M10 2 L15 14 L10 11 L5 14 Z" fill="${color}"/></svg>`;
}

// ---------- Google Météo (API officielle, clé personnelle) ----------
// 5 pages de 24 h = 5 appels, mis en cache 1 h par spot pour rester très en dessous du quota gratuit.
async function googleForecast(spot){
  const key = store.get("gkey",""); if(!key) return null;
  const ck = `gcache_${spot.lat.toFixed(3)}_${spot.lon.toFixed(3)}`;
  const c = store.get(ck, null); if(c && Date.now()-c.ts < 3600e3 && c.key===key.slice(-6)) { state.gErr=null; return {hourly:c.h}; }
  const hours = []; let tok = "";
  try{
    for(let page=0; page<5; page++){
      const url = `https://weather.googleapis.com/v1/forecast/hours:lookup?key=${encodeURIComponent(key)}&location.latitude=${spot.lat}&location.longitude=${spot.lon}&hours=120&pageSize=24&languageCode=fr${tok?`&pageToken=${encodeURIComponent(tok)}`:""}`;
      const r = await fetch(url); const j = await r.json();
      if(!r.ok){ state.gErr = j?.error?.message || `erreur ${r.status}`; return null; }
      hours.push(...(j.forecastHours||[])); tok = j.nextPageToken; if(!tok) break;
    }
  }catch(e){ state.gErr = "pas de réponse de Google"; return null; }
  state.gErr = null;
  const pad=n=>String(n).padStart(2,"0");
  const H = {time:[], wind_speed_10m:[], wind_gusts_10m:[], wind_direction_10m:[], temperature_2m:[], cloud_cover:[], precipitation:[], is_day:[], rain_prob:[], cond:[]};
  hours.forEach(f=>{
    const d = new Date(f.interval?.startTime); if(isNaN(d)) return;
    H.time.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:00`);
    const kmh2kn = v => v==null?null:v/1.852;
    H.wind_speed_10m.push(kmh2kn(f.wind?.speed?.value)); H.wind_gusts_10m.push(kmh2kn(f.wind?.gust?.value));
    H.wind_direction_10m.push(f.wind?.direction?.degrees ?? null);
    H.temperature_2m.push(f.temperature?.degrees ?? null); H.cloud_cover.push(f.cloudCover ?? null);
    H.precipitation.push(f.precipitation?.qpf?.quantity ?? 0); H.is_day.push(f.isDaytime===false?0:1);
    const pr = f.precipitation?.probability?.percent; H.rain_prob.push(pr==null?null:pr/100);
    H.cond.push(f.weatherCondition?.description?.text || null);
  });
  store.set(ck, {ts:Date.now(), key:key.slice(-6), h:H});
  return {hourly:H};
}

// ---------- Google WeatherNext 2 : 64 scénarios toutes les 6 h → série horaire ----------
// Moyenne des scénarios (vent, température, nuages), pluie du bloc de 6 h répartie sur les heures,
// et probabilité de pluie = part des scénarios qui donnent au moins 0,5 mm sur le bloc.
function ensembleToHourly(E){
  const T = E.time, N = T.length;
  const members = v => Object.keys(E).filter(k=>k===v || k.startsWith(v+"_member"));
  const mean = v => { const ks=members(v); return T.map((_,i)=>{ let s=0,n=0; ks.forEach(k=>{const x=E[k][i]; if(x!=null){s+=x;n++;}}); return n?s/n:null; }); };
  const ws=mean("wind_speed_10m"), tt=mean("temperature_2m"), cc=mean("cloud_cover"), pp=mean("precipitation");
  const pk=members("precipitation");
  const prob = T.map((_,i)=>{ let n=0,w=0; pk.forEach(k=>{const x=E[k][i]; if(x!=null){n++; if(x>=0.5) w++;}}); return n?w/n:null; });
  const dk=members("wind_direction_10m"), sk=members("wind_speed_10m");
  const wd = T.map((_,i)=>{ let x=0,y=0; dk.forEach((k,m)=>{ const d=E[k][i], s=E[sk[m]]?.[i]; if(d==null||s==null) return; x+=Math.sin(d*Math.PI/180)*s; y+=Math.cos(d*Math.PI/180)*s; }); return (x||y)?(Math.atan2(x,y)*180/Math.PI+360)%360:null; });
  const ms = T.map(t=>new Date(t).getTime());
  const H = {time:[], wind_speed_10m:[], wind_gusts_10m:[], wind_direction_10m:[], temperature_2m:[], cloud_cover:[], precipitation:[], rain_prob:[]};
  const pad = n => String(n).padStart(2,"0");
  for(let k=0;k<N-1;k++){
    for(let h=1;h<=6;h++){
      const t = new Date(ms[k]+h*3600e3); const f=h/6;
      const lerp = a => a[k]==null||a[k+1]==null ? (a[k+1]??null) : a[k]+(a[k+1]-a[k])*f;
      H.time.push(`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}T${pad(t.getHours())}:00`);
      H.wind_speed_10m.push(lerp(ws)); H.temperature_2m.push(lerp(tt)); H.cloud_cover.push(lerp(cc));
      H.wind_direction_10m.push(f<0.5?wd[k]:wd[k+1]); H.wind_gusts_10m.push(null);
      H.precipitation.push(pp[k+1]==null?null:pp[k+1]/6); H.rain_prob.push(prob[k+1]);
    }
  }
  return H;
}

// Requête JSON avec une nouvelle tentative en cas d'échec passager
async function getJSON(url){
  for(let k=0;k<2;k++){
    try{ const r=await fetch(url); if(r.ok) return await r.json(); if(r.status<500 && r.status!==429) return null; }catch(e){}
    await new Promise(res=>setTimeout(res, 900+Math.random()*600));
  }
  return null;
}

// ---------- Données ----------
async function load(){
  const spot = state.spots[state.spotIdx]; if(!spot) return;
  $("#title").textContent = spot.name;
  $("#subtitle").textContent = spot.sub || `${spot.lat.toFixed(2)}°, ${spot.lon.toFixed(2)}°`;
  $("#tableArea").innerHTML = `<div class="status">Chargement des modèles…</div>`; $("#content").innerHTML = ""; $("#simple").innerHTML = `<div class="card"><div class="status">Chargement…</div></div>`;
  const base = `latitude=${spot.lat}&longitude=${spot.lon}&timezone=Europe%2FParis&forecast_days=${state.days}&wind_speed_unit=kn`;
  const AM = activeModels();
  const reqs = AM.map(m=> m.gapi ? googleForecast(spot) : m.ens
    ? getJSON(`https://ensemble-api.open-meteo.com/v1/ensemble?${base}&temporal_resolution=native&hourly=wind_speed_10m,wind_direction_10m,temperature_2m,precipitation,cloud_cover&models=google_weathernext2_ensemble`).then(j=>j&&j.hourly?{hourly:ensembleToHourly(j.hourly)}:null).catch(()=>null)
    : getJSON(`https://api.open-meteo.com/v1/forecast?${base}&hourly=${HOURLY}&models=${m.id}`).catch(()=>null));
  const marineReq = getJSON(`https://marine-api.open-meteo.com/v1/marine?latitude=${spot.lat}&longitude=${spot.lon}&timezone=Europe%2FParis&forecast_days=${state.days}&hourly=wave_height,wave_period,wave_direction`).catch(()=>null);
  const rainReqs = RAIN_EXTRA.map(m=>getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lon}&timezone=Europe%2FParis&forecast_days=${Math.min(state.days,4)}&hourly=precipitation&models=${m.id}`).catch(()=>null));
  const nowReq = getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${spot.lat}&longitude=${spot.lon}&timezone=Europe%2FParis&minutely_15=precipitation&forecast_minutely_15=16&past_minutely_15=1&models=meteofrance_seamless`).catch(()=>null);
  const [res, marine, rainRes, now15] = await Promise.all([Promise.all(reqs), marineReq, Promise.all(rainReqs), nowReq]);
  state.rain = {}; RAIN_EXTRA.forEach((m,i)=>{ if(rainRes[i]&&rainRes[i].hourly) state.rain[m.id]=rainRes[i].hourly; });
  state.now15 = now15&&now15.minutely_15 ? now15.minutely_15 : null;
  if(spot !== state.spots[state.spotIdx]) return; // spot changé entre-temps
  state.data = {}; AM.forEach((m,i)=>{ if(res[i]&&res[i].hourly) state.data[m.id]=res[i].hourly; });
  state.marine = marine&&marine.hourly ? marine.hourly : null;
  if(!Object.keys(state.data).length){ $("#simple").innerHTML = `<div class="card"><div class="status err">Impossible de récupérer les prévisions.</div></div>`; $("#tableArea").innerHTML = `<div class="status err">Impossible de récupérer les prévisions.</div><div class="status">Si tu regardes cette page dans l'aperçu de Claude, c'est normal : l'aperçu bloque l'accès à Internet.<br>Télécharge le fichier et ouvre-le dans Safari, Chrome ou Firefox.</div>`; return; }
  render();
}

// Série continue : modèle choisi, puis relais ECMWF → GFS → ICON → AROME au-delà de son horizon
const FIELDS = ["wind_speed_10m","wind_gusts_10m","wind_direction_10m","temperature_2m","cloud_cover","precipitation","is_day"];
function mergedSeries(){
  const order = [state.model,"ecmwf_ifs025","gfs_seamless","icon_seamless","meteofrance_seamless"].filter((m,i,a)=>a.indexOf(m)===i && state.data[m]);
  const ref = order.map(m=>state.data[m]).sort((a,b)=>b.time.length-a.time.length)[0];
  const maps = Object.fromEntries(order.map(m=>[m, Object.fromEntries(state.data[m].time.map((t,i)=>[t,i]))]));
  const H = {time:[], src:[]}; FIELDS.forEach(f=>H[f]=[]);
  ref.time.forEach(t=>{
    const m = order.find(m=>{const k=maps[m][t]; return k!=null && state.data[m].wind_speed_10m[k]!=null;});
    H.time.push(t); H.src.push(m||null);

// Lever/coucher du soleil (algorithme NOAA simplifié, précision ~1 min)
function sunTimes(dateStr, lat, lng, h0=-0.833){
  const rad=Math.PI/180, dayMs=864e5, J1970=2440588, J2000=2451545, e=rad*23.4397, J0=0.0009;
  const toDays = d => d/dayMs - 0.5 + J1970 - J2000;
  const fromJ = j => new Date((j + 0.5 - J1970)*dayMs);
  const date = new Date(dateStr+"T12:00:00");
  const lw = rad*-lng, phi = rad*lat, d = toDays(date.getTime());
  const n = Math.round(d - J0 - lw/(2*Math.PI));
  const ds = J0 + lw/(2*Math.PI) + n;
  const M = rad*(357.5291 + 0.98560028*ds);
  const C = rad*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M));
  const L = M + C + rad*102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e)*Math.sin(L));
  const Jnoon = J2000 + ds + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L);
  const w = Math.acos((Math.sin(h0*rad) - Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));
  const Jset = J2000 + (J0 + (w + lw)/(2*Math.PI) + n) + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L);
  const Jrise = Jnoon - (Jset - Jnoon);
  if(isNaN(w)) return null;
  return {rise: fromJ(Jrise), set: fromJ(Jset)};
}
const hmSun = d => d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Paris"}).replace(":","h");
function sunFor(d){ const sp=state.spots[state.spotIdx]; const t=sp?sunTimes(d,sp.lat,sp.lon):null; if(!t) return null;
  const len=(t.set-t.rise)/60000; const nt=sunTimes(d,sp.lat,sp.lon,-18); // nuit complète = soleil 18° sous l'horizon
  return {rise:t.rise, set:t.set, riseTxt:hmSun(t.rise), setTxt:hmSun(t.set), nightTxt: nt?hmSun(nt.set):null, nightH: nt?+hmSun(nt.set).slice(0,2):null, lenTxt:`${Math.floor(len/60)}h${String(Math.round(len%60)).padStart(2,"0")}`,
    riseH:+hmSun(t.rise).slice(0,2), setH:+hmSun(t.set).slice(0,2)}; }

// État du ciel déduit des données (nuages, pluie, température)
function sky(cloud, rain, temp, day){
  if(rain!=null && rain>=0.2){ if(temp!=null && temp<=1) return "snow"; return rain>=2 ? "heavy" : "rain"; }
  if(cloud==null) return day?"partly":"night";
  if(cloud<20) return day?"clear":"night";
  if(cloud<60) return day?"partly":"nightpartly";
  if(cloud<85) return "mostly";
  return "overcast";
}

const SKY_RANK = {clear:0,night:0,partly:1,nightpartly:1,mostly:2,overcast:3,rain:4,heavy:5,snow:5};

  const drops = n => `<g stroke="#3d7bff" stroke-width="3" stroke-linecap="round">${[16,25,34].slice(0,n).map(x=>`<line x1="${x}" y1="41" x2="${x-3}" y2="47"/>`).join("")}</g>`;
  const flakes = `<g fill="#9fc2ff">${[16,25,34].map(x=>`<circle cx="${x}" cy="44" r="2.6"/>`).join("")}</g>`;

// Accord des modèles sur la pluie, heure par heure
function rainAgreement(){
  const out = {};
  RAIN_ROWS.forEach(r=>{ const h = r.src==="rain" ? state.rain?.[r.id] : state.data?.[r.id]; if(!h) return;
    h.time.forEach((t,i)=>{ const v=h.precipitation[i]; if(v==null) return; (out[t] ||= {n:0,wet:0}); out[t].n++; if(v>=0.2) out[t].wet++; }); });
  return out;
}

    const wv = o.waves.length ? Math.max(...o.waves) : null;
    return `<div class="day" data-day="${d}">
      <div class="d">${fmtDay(d+"T12:00")}</div>
      <div class="big">${r0(cv(mx))}<small> ${unit} max</small></div>
      <div class="meta">
        <span>${arrowSVG(dd,"var(--text-2)")} ${dirName(dd)} · moy. ${r0(cv(avg))} · raf. ${r0(cv(gx))}</span>
        ${(()=>{const sn=sunFor(d);return sn?`<span>🌅 ${sn.riseTxt} · 🌇 ${sn.setTxt}${sn.nightTxt?` · 🌙 ${sn.nightTxt}`:""}</span>`:""})()}
        <span>${r0(Math.min(...o.t))}° / ${r0(Math.max(...o.t))}°${o.p>=0.2?` · <span class="rain">${o.p.toFixed(1)} mm</span>`:" · sec"}${wv!=null?` · houle ${wv.toFixed(1)} m`:""}</span>
      </div>
      <div class="bar" style="background:${bg}"></div>
      ${lw?`<span class="tag">${lw}</span>`:""}
      ${(()=>{const top=Object.entries(o.src).sort((a,b)=>b[1]-a[1])[0][0];return top!==mid?`<span class="tag">via ${MODELS.find(m=>m.id===top).short}</span>`:""})()}
    </div>`;
  }).join("");

  // ----- Tableau horaire façon Windguru -----
  let lastDay=null; const dayHead=[], hrs=[], cols=[];
  idx.forEach(i=>{
    const t=H.time[i], d=t.slice(0,10); const sep = d!==lastDay; lastDay=d;
    cols.push({i,t,sep,d});
  });
  // ligne des jours (colspan)
  const groups=[]; cols.forEach(c=>{ if(c.sep) groups.push({d:c.d,n:0}); groups[groups.length-1].n++; });
  const rowDays = `<tr class="dayrow"><th class="lab"></th>${groups.map(g=>`<th colspan="${g.n}" class="dsep" data-dayanchor="${g.d}">${g.n>=2?fmtDay(g.d+"T12:00",{weekday:g.n>=7?"long":"short",day:"numeric"}):""}</th>`).join("")}</tr>`;
  const cell = (c,inner,cls="",style="") => `<td class="${c.sep?"dsep ":""}${H.is_day&&H.is_day[c.i]===0?"night ":""}${cls}" style="${style}">${inner}</td>`;
  const rowH = `<tr class="hr"><th class="lab">h</th>${cols.map(c=>cell(c,c.t.slice(11,13))).join("")}</tr>`;
  let prevSrc=null;
  const rowS = `<tr class="hr"><th class="lab" title="Modèle utilisé">Mod.</th>${cols.map(c=>{const sc=H.src[c.i];const show=sc!==prevSrc;prevSrc=sc;return cell(c,show?`<span style="font-size:8.5px;white-space:nowrap">${MODELS.find(m=>m.id===sc)?.short||""}</span>`:"")}).join("")}</tr>`;
  const rowW = `<tr><th class="lab" title="Vent moyen">Vent<small>${unit}</small></th>${cols.map(c=>{const v=H.wind_speed_10m[c.i];const [bg,fg]=windColor(v);return cell(c,r0(cv(v)),"w",`background:${bg};color:${fg}`)}).join("")}</tr>`;
  const rowG = `<tr><th class="lab" title="Rafales">Raf.<small>${unit}</small></th>${cols.map(c=>{const v=H.wind_gusts_10m[c.i];const [bg,fg]=windColor(v);return cell(c,r0(cv(v)),"w",`background:${bg};color:${fg}`)}).join("")}</tr>`;
  const rowD = `<tr><th class="lab" title="Direction du vent">Dir.</th>${cols.map(c=>{const d=H.wind_direction_10m[c.i];return cell(c,`${arrowSVG(d,"var(--text)")}<span class="dirtxt">${dirName(d)}</span>`,"","height:30px")}).join("")}</tr>`;
  const colored = (c,scale,v,txt) => { const [bg,fg]=wgColor(scale,v); return cell(c,txt,"w",`background:${bg};color:${fg};font-weight:500`); };
  const rowT = `<tr><th class="lab" title="Température">T°<small>°C</small></th>${cols.map(c=>{const v=H.temperature_2m[c.i];return colored(c,"temp",v,r0(v))}).join("")}</tr>`;
  const rowC = `<tr><th class="lab" title="Couverture nuageuse">Nuag.<small>%</small></th>${cols.map(c=>{const v=H.cloud_cover[c.i];return colored(c,"cloud",v,v==null?"–":Math.round(v))}).join("")}</tr>`;
  const rowP = `<tr><th class="lab" title="Pluie">Pluie<small>mm/${state.step}h</small></th>${cols.map(c=>{let s=0;for(let k=0;k<state.step;k++){s+=H.precipitation[c.i+k]||0}return s>=0.1?colored(c,"rain",s/state.step,s<1?s.toFixed(1):Math.round(s)):cell(c,"")}).join("")}</tr>`;
  let rowsMarine="";
  if(M && M.wave_height.some(v=>v!=null)){
    rowsMarine += `<tr><th class="lab" title="Hauteur des vagues">Houle<small>m</small></th>${cols.map(c=>{const k=mIndex[c.t];const v=k!=null?M.wave_height[k]:null;return colored(c,"waves",v,v==null?"–":v.toFixed(1))}).join("")}</tr>`;
    rowsMarine += `<tr><th class="lab" title="Période des vagues">Pér.<small>s</small></th>${cols.map(c=>{const k=mIndex[c.t];const v=k!=null?M.wave_period[k]:null;return colored(c,"period",v,v==null?"–":Math.round(v))}).join("")}</tr>`;
    rowsMarine += `<tr><th class="lab" title="Direction de la houle">D.h.</th>${cols.map(c=>{const k=mIndex[c.t];const v=k!=null?M.wave_direction[k]:null;return cell(c,arrowSVG(v,"var(--text-2)"))}).join("")}</tr>`;
  }
  // Pluie par modèle (même pas horaire que le tableau) + ligne d'accord
  const nCols = cols.length + 1;
  const series = RAIN_ROWS.map(r=>{ const h = r.src==="rain" ? state.rain?.[r.id] : state.data?.[r.id]; if(!h) return null;
    const map = Object.fromEntries(h.time.map((t,i)=>[t,i]));
    const vals = cols.map(c=>{ let sum=0, any=false; for(let k=0;k<state.step;k++){ const t=H.time[c.i+k]; const j=map[t]; const v=j!=null?h.precipitation[j]:null; if(v!=null){sum+=v;any=true;} } return any?sum:null; });
    return {r, vals}; }).filter(x=>x && x.vals.some(v=>v!=null));
  let rowsRain = "";
  if(series.length){
    rowsRain += `<tr class="grp"><th class="lab" colspan="${nCols}" style="position:sticky;left:0">Pluie par modèle · mm/${state.step}h</th></tr>`;
    series.forEach(({r,vals})=>{
      rowsRain += `<tr class="rm"><th class="lab" title="${r.title}">${r.short}</th>${cols.map((c,k)=>{ const v=vals[k]; if(v==null) return cell(c,"","na"); return v>=0.1?colored(c,"rain",v/state.step,v<1?v.toFixed(1):Math.round(v)):cell(c,""); }).join("")}</tr>`;
    });
    rowsRain += `<tr class="rm"><th class="lab" title="Nombre de modèles qui prévoient au moins 0,2 mm">Accord</th>${cols.map((c,k)=>{ const avail=series.filter(x=>x.vals[k]!=null); if(!avail.length) return cell(c,"","na"); const n=avail.filter(x=>x.vals[k]>=0.2).length; if(!n) return cell(c,`<span style="color:var(--muted);font-size:9.5px">0/${avail.length}</span>`); const f=n/avail.length; return cell(c,`${n}/${avail.length}`,"w",`background:rgba(110,110,250,${(0.15+0.75*f).toFixed(2)});color:${f>0.6?"#fff":"var(--text)"};font-size:10px`); }).join("")}</tr>`;
    for(const [gid,gname,gtitle] of [["google_api","Google","Google Météo : probabilité de pluie annoncée"],["google_wn2","WN2","Google WeatherNext 2 : part des 64 scénarios avec au moins 0,5 mm sur 6 h"]]){ const G = state.data?.[gid]; if(!G || !G.rain_prob) continue; const gm=Object.fromEntries(G.time.map((t,i)=>[t,i]));
      rowsRain += `<tr class="rm"><th class="lab" title="${gtitle}">Proba<small>${gname}</small></th>${cols.map(c=>{ let pmax=null; for(let k=0;k<state.step;k++){ const j=gm[H.time[c.i+k]]; const v=j!=null?G.rain_prob[j]:null; if(v!=null) pmax=Math.max(pmax??0,v); } if(pmax==null) return cell(c,"","na"); if(pmax<0.05) return cell(c,`<span style="color:var(--muted);font-size:9.5px">0</span>`); return cell(c,`${Math.round(pmax*100)}`,"w",`background:rgba(110,110,250,${(0.12+0.78*pmax).toFixed(2)});color:${pmax>0.6?"#fff":"var(--text)"};font-size:10px`); }).join("")}</tr>`; }
  }

  // Bandeau pluie dans les 4 prochaines heures (AROME au quart d'heure)
  let nowcast = "";
  const Q = state.now15;
  if(Q && Q.precipitation && Q.precipitation.some(v=>v!=null)){
    const t0 = new Date(Date.now()-15*60000);
    const q = Q.time.map((t,i)=>({t, v:Q.precipitation[i]})).filter(x=>new Date(x.t)>=t0 && x.v!=null).slice(0,16);
    if(q.length){
      const wet = q.filter(x=>x.v>=0.1);
      const hm = t => t.slice(11,16).replace(":","h");
      const minus15 = t => { const d=new Date(new Date(t).getTime()-15*60000); return `${String(d.getHours()).padStart(2,"0")}h${String(d.getMinutes()).padStart(2,"0")}`; };
      let msg;
      if(!wet.length) msg = `<b>Pas de pluie</b> prévue d'ici ${hm(q[q.length-1].t)}`;
      else { const first=wet[0], last=wet[wet.length-1], tot=wet.reduce((a,x)=>a+x.v,0);
        msg = new Date(first.t).getTime()-15*60000<=Date.now() ? `<b>Pluie en cours</b>, jusqu'à ~${hm(last.t)} · ${tot.toFixed(1)} mm` : `<b>Pluie vers ${minus15(first.t)}</b> jusqu'à ~${hm(last.t)} · ${tot.toFixed(1)} mm`; }
      const boxes = q.map((x,i)=>{ const [bg]=wgColor("rain", x.v*4); return `<span class="${i&&x.t.slice(14,16)==="00"?"h":""}" title="${minus15(x.t)}–${hm(x.t)} : ${x.v.toFixed(1)} mm" style="background:${x.v>=0.05?bg:"transparent"}"></span>`; }).join("");
      nowcast = `<div class="nowcast">☂ ${msg}<span class="q">${boxes}</span><span style="color:var(--muted);font-size:10.5px">AROME · pas de 15 min</span></div>`;
    }
  }

  const scale = [3,6,9,12,15,18,21,24,27,30,35,40,50,60].map(kn=>{const [bg,fg]=windColor(kn);return `<span class="sw" style="background:${bg};color:${fg};border:1px solid var(--border)">${Math.round(kn*UNITS[state.unit].f)}</span>`}).join("");

  const tw0 = document.querySelector(".tablewrap"); const keepScroll = tw0 && tw0.dataset.spot===String(state.spotIdx) ? tw0.scrollLeft : 0;
  $("#tableArea").innerHTML = `${nowcast}
      <div class="tablewrap" data-spot="${state.spotIdx}"><table class="fc">${rowDays}${rowH}${rowS}${rowW}${rowG}${rowD}${rowT}${rowC}${rowP}${rowsMarine}${rowsRain}</table></div>
      <div class="relay">${mInfo.label}${relay}</div>
      <div class="legend-scale"><span style="margin-right:4px">${unit} :</span>${scale}<span style="margin-left:4px">+</span></div>`;
  $("#content").innerHTML = `
    <div class="card"><h2>Les ${Object.keys(byDay).length} prochains jours <small>vent de journée 8h–19h · touche un jour pour le voir dans le tableau</small></h2><div class="days">${dayCards}</div></div>
    <div class="card"><h2>Comparaison des modèles <small>vent moyen à 10 m, ${unit}</small></h2>
      <div class="chart-legend" id="clegend"></div>
      <div id="chartbox"><svg id="chart" width="100%" height="${innerWidth<600?220:300}"></svg><div id="tip"></div></div>
    </div>`;
  const tw = document.querySelector(".tablewrap"); tw.scrollLeft = keepScroll;
  const labW = () => tw.querySelector("th.lab").offsetWidth;
  const jump = dir => { const ths=[...document.querySelectorAll("th[data-dayanchor]")]; const x0=tw.getBoundingClientRect().left+labW(); const pos=ths.map(th=>th.getBoundingClientRect().left-x0); let target = dir>0 ? pos.find(p=>p>5) : [...pos].reverse().find(p=>p<-5); if(target==null) target = dir>0? tw.scrollWidth : -tw.scrollWidth; tw.scrollBy({left:target,behavior:"smooth"}); };
  $("#scrL").onclick=()=>jump(-1); $("#scrR").onclick=()=>jump(1);
  drawChart(now);
}

// ---------- Graphique multi-modèles ----------
function drawChart(now){
  const svg = $("#chart"), box=$("#chartbox"), tip=$("#tip");
  const avail = MODELS.filter(m=>state.data[m.id] && state.data[m.id].wind_speed_10m.some(v=>v!=null));
  $("#clegend").innerHTML = avail.map(m=>`<label><input type="checkbox" data-hide="${m.id}" ${state.hidden.includes(m.id)?"":"checked"}><i style="background:var(${m.color})"></i>${m.label}</label>`).join("");
  $("#clegend").querySelectorAll("input").forEach(inp=>inp.onchange=()=>{
    const id=inp.dataset.hide; state.hidden = inp.checked ? state.hidden.filter(x=>x!==id) : [...state.hidden,id]; store.set("hidden",state.hidden); drawChart(now);
  });
  const shown = avail.filter(m=>!state.hidden.includes(m.id));
  const ref = state.data[avail[0].id];
  const times = ref.time.filter(t=>new Date(t)>=now);
  const W = box.clientWidth || 900, Hh = 300, pl=36, pr=70, pt=12, pb=28;
  svg.setAttribute("viewBox",`0 0 ${W} ${Hh}`);
  const series = shown.map(m=>{const h=state.data[m.id];const map=Object.fromEntries(h.time.map((t,i)=>[t,i]));return {m, vals:times.map(t=>{const k=map[t];return k==null?null:cv(h.wind_speed_10m[k])}), gust:times.map(t=>{const k=map[t];return k==null?null:cv(h.wind_gusts_10m[k])})}});
  let ymax = Math.max(10, ...series.flatMap(s=>s.vals.filter(v=>v!=null)));
  const stepY = ymax>60?20:ymax>30?10:5; ymax = Math.ceil(ymax/stepY)*stepY;
  const x = i => pl + (W-pl-pr) * i/(times.length-1);
  const y = v => pt + (Hh-pt-pb)*(1-v/ymax);
  const grid = getComputedStyle(document.documentElement).getPropertyValue("--grid");
  let g = "";
  for(let v=0; v<=ymax; v+=stepY){ g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`; }
  times.forEach((t,i)=>{ if(t.slice(11,13)==="00"){ g+=`<line x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${Hh-pb}" stroke="var(--grid)" stroke-width="1"/>`; }
    if(t.slice(11,13)==="12"){ g+=`<text x="${x(i)}" y="${Hh-8}" text-anchor="middle" font-size="11" fill="var(--text-2)">${fmtDay(t,{weekday:"short",day:"numeric"})}</text>`; } });
  let lines="", ends=[];
  series.forEach(s=>{
    let d="", pen=false;
    s.vals.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1); pen=true; });
    lines += `<path d="${d}" fill="none" stroke="var(${s.m.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    let li=s.vals.length-1; while(li>0&&s.vals[li]==null) li--;
    ends.push({m:s.m, x:x(li), y:y(s.vals[li]), lx:x(li)});
  });
  // étiquettes directes sans chevauchement
  const right = ends.filter(e=>e.lx>=W-pr-20).sort((a,b)=>a.y-b.y); for(let k=1;k<right.length;k++){ if(right[k].y-right[k-1].y<14) right[k].y=right[k-1].y+14; }
  const labels = ends.map(e=>{const early=e.lx<W-pr-20;return `<text x="${early?e.lx:W-pr+8}" y="${early?e.y-8:e.y+4}" text-anchor="${early?"middle":"start"}" font-size="12" fill="var(--text-2)" paint-order="stroke" stroke="var(--surface)" stroke-width="3">${e.m.short}</text>`}).join("");
  svg.innerHTML = g + lines + labels + `<line id="xh" y1="${pt}" y2="${Hh-pb}" stroke="var(--text-2)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/><g id="dots"></g><rect x="${pl}" y="0" width="${W-pl-pr}" height="${Hh}" fill="transparent" id="hit"/>`;
  const hit = svg.querySelector("#hit"), xh=svg.querySelector("#xh"), dots=svg.querySelector("#dots");
  const move = ev=>{
    const rect = svg.getBoundingClientRect(); const px=(ev.clientX-rect.left)*W/rect.width;
    const i = Math.max(0,Math.min(times.length-1, Math.round((px-pl)/(W-pl-pr)*(times.length-1))));
    xh.setAttribute("x1",x(i)); xh.setAttribute("x2",x(i)); xh.setAttribute("visibility","visible");
    dots.innerHTML = series.filter(s=>s.vals[i]!=null).map(s=>`<circle cx="${x(i)}" cy="${y(s.vals[i])}" r="4.5" fill="var(${s.m.color})" stroke="var(--surface)" stroke-width="2"/>`).join("");
    const u=UNITS[state.unit].short;
    tip.innerHTML = `<div class="t">${fmtDay(times[i],{weekday:"long",day:"numeric"})} · ${times[i].slice(11,13)}h</div>` + series.map(s=>`<div class="r"><span><i style="background:var(${s.m.color})"></i>${s.m.short}</span><span>${r0(s.vals[i])} <span style="color:var(--muted)">raf. ${r0(s.gust[i])}</span> ${u}</span></div>`).join("");
    tip.style.display="block";
    const left = x(i)*rect.width/W; const tw=tip.offsetWidth;
    tip.style.left = (left+14+tw>rect.width ? left-tw-14 : left+14)+"px"; tip.style.top="10px";
  };
  hit.addEventListener("mousemove",move); hit.addEventListener("touchmove",e=>{move(e.touches[0]);},{passive:true});
  hit.addEventListener("mouseleave",()=>{tip.style.display="none";xh.setAttribute("visibility","hidden");dots.innerHTML="";});
}
let rz; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>state.data&&drawChart(new Date(new Date().setMinutes(0,0,0))),150)});

renderControls(); load();
setInterval(load, 30*60*1000); // rafraîchit toutes les 30 min
</script>
</body>
